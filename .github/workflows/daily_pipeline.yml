name: Daily Lead Prospector & Cold Outreach Pipeline

on:
  schedule:
    # Runs at 08:00 UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit changes to Google Sheets)'
        required: false
        default: 'false'
        type: boolean
      mock_scrape:
        description: 'Use mock scraping/generation for testing'
        required: false
        default: 'false'
        type: boolean
      niche_override:
        description: 'Override daily rotating niche'
        required: false
        default: ''
        type: string
      region_override:
        description: 'Override daily rotating region'
        required: false
        default: ''
        type: string
      worksheet_override:
        description: 'Target worksheet tab name (default: Sheet1)'
        required: false
        default: ''
        type: string

jobs:
  run-pipeline:
    name: Run Lead Prospector & Outreach
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Lead Pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ inputs.worksheet_override || secrets.GOOGLE_WORKSHEET_NAME || 'Sheet1' }}
          DRY_RUN: ${{ inputs.dry_run }}
          MOCK_SCRAPE: ${{ inputs.mock_scrape }}
          NICHE_OVERRIDE: ${{ inputs.niche_override }}
          REGION_OVERRIDE: ${{ inputs.region_override }}
        run: |
          python pipeline.py
